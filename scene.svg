<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The breakwater in three depths: in the far depth waves rise, travel, and break in a slow heavy sequence against the wall while driven cloud moves fast and low overhead, in the middle depth spray breaks over the stones wave by wave and runs back off the stone while the lamp at the end of the arm does not move at all and its light brightens only in the instant spray crosses it, and in the near depth tarred barrels stand still with water dripping from their rims after each spray fall and stopping between falls">
